version: '3.8'

services:
  # Config Server
  mongo-config:
    image: mongo:7.0
    container_name: mongo-config
    command: mongod --configsvr --replSet configrs --port 27019 --dbpath /data/configdb
    ports:
      - "27019:27019"
    volumes:
      - mongo-config-data:/data/configdb
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - mongo-cluster

  # Shard 1
  mongo-shard1:
    image: mongo:7.0
    container_name: mongo-shard1
    command: mongod --shardsvr --replSet shard1rs --port 27018 --dbpath /data/db
    ports:
      - "27018:27018"
    volumes:
      - mongo-shard1-data:/data/db
    networks:
      - mongo-cluster

  # Shard 2  
  mongo-shard2:
    image: mongo:7.0
    container_name: mongo-shard2
    command: mongod --shardsvr --replSet shard2rs --port 27020 --dbpath /data/db
    ports:
      - "27020:27020"
    volumes:
      - mongo-shard2-data:/data/db
    networks:
      - mongo-cluster

  # Shard 3
  mongo-shard3:
    image: mongo:7.0
    container_name: mongo-shard3
    command: mongod --shardsvr --replSet shard3rs --port 27021 --dbpath /data/db
    ports:
      - "27021:27021"
    volumes:
      - mongo-shard3-data:/data/db
    networks:
      - mongo-cluster

  # MongoDB Router (mongos)
  mongo-router:
    image: mongo:7.0
    container_name: mongo-router
    command: mongos --configdb configrs/mongo-config:27019 --port 27017
    ports:
      - "27017:27017"
    depends_on:
      - mongo-config
      - mongo-shard1
      - mongo-shard2
      - mongo-shard3
    networks:
      - mongo-cluster

  # MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo-router:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongo-router
    networks:
      - mongo-cluster

volumes:
  mongo-config-data:
  mongo-shard1-data:
  mongo-shard2-data:
  mongo-shard3-data:

networks:
  mongo-cluster:
    driver: bridge